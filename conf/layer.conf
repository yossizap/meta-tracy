# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tracy"
BBFILE_PATTERN_meta-tracy = "^${LAYERDIR}/"
# Let meta-oe provide common libraries when both layers are present.
BBFILE_PRIORITY_meta-tracy = "4"

LAYERDEPENDS_meta-tracy = "core"
LAYERSERIES_COMPAT_meta-tracy = "scarthgap kirkstone"

BBFILES_DYNAMIC += " \
    tegra:${LAYERDIR}/dynamic-layers/meta-tegra/recipes-*/*/*.bb \
    tegra:${LAYERDIR}/dynamic-layers/meta-tegra/recipes-*/*/*.bbappend \
"
