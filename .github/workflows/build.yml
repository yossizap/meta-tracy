name: Build

on:
  push:
  pull_request:

jobs:
  qemu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        branch: [scarthgap, kirkstone]
    steps:
      - name: Free build space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc
          df -h .
      - uses: actions/checkout@v4
        with:
          path: meta-tracy
      - uses: actions/checkout@v4
        with:
          repository: yoctoproject/poky
          ref: ${{ matrix.branch }}
          path: poky
      - uses: actions/checkout@v4
        with:
          repository: openembedded/meta-openembedded
          ref: ${{ matrix.branch }}
          path: meta-openembedded
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chrpath cpio debianutils diffstat \
            file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 \
            python3-git python3-jinja2 python3-pexpect python3-pip \
            python3-subunit socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Parse and build Tracy client
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          source poky/oe-init-build-env build
          bitbake-layers add-layer ../meta-openembedded/meta-oe
          printf '\nMACHINE = "qemux86-64"\n' >> conf/local.conf
          yocto-check-layer ../meta-tracy
          bitbake-layers add-layer ../meta-tracy
          for recipe in glfw nlohmann-json pugixml; do
            file="$(bitbake -e "$recipe" | sed -n 's/^FILE="\([^"]*\)"/\1/p')"
            echo "$recipe: $file"
            [[ "$file" == */meta-openembedded/meta-oe/* ]]
          done
          file="$(bitbake -e md4c | sed -n 's/^FILE="\([^"]*\)"/\1/p')"
          echo "md4c: $file"
          if [[ '${{ matrix.branch }}' == scarthgap ]]; then
            [[ "$file" == */meta-openembedded/meta-oe/* ]]
          else
            [[ "$file" == */meta-tracy/recipes-support/md4c/* ]]
          fi
          bitbake tracy-client tracy-capture tracy-csvexport
